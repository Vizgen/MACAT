# Environment for BUILDING the Allen reference tables (scripts/data/), not for
# running the app. Kept separate from macat so the app's verified
# environment does not change to gain two packages only these scripts need
# (anndata, h5py). Create with:
#
#     conda env create -f environment_allen_reference.yml
#
# Pinned to the versions the 2026-10-19 rebuild was verified with: the tables
# it produced were compared against the originals byte for byte.
name: allen_reference
channels:
  - conda-forge
dependencies:
  - python=3.10
  - anndata=0.11.4
  - h5py=3.16.0
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy=1.15.2
